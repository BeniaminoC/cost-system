; ============================================================
;  Delicious Food - Sistema de Costos Estandar
;  Archivo de configuracion de parametros del sistema
;  (reinicie el sistema despues de modificar este archivo)
; ============================================================
[servidor]
host = 127.0.0.1
puerto = 8080
abrir_navegador = true

[base_datos]
; Base de datos local embebida (no requiere servidor ni internet)
motor = sqlite
ruta = data/delicious_food.db
cargar_datos_ejemplo = true

[seguridad]
minutos_sesion = 60
iteraciones_hash = 120000
intentos_maximos_login = 5
bloqueo_segundos = 60

[aplicacion]
nombre = Delicious Food - Sistema de Costos
moneda = COP
