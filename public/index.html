<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delicious Food - Sistema de Costos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<section id="login">
  <div class="brand">
    <h1>Delicious Food</h1>
    <p>Sistema de costos estándar para producción de comida rápida: materiales, mano de obra, CIF y análisis de variaciones.</p>
    <p class="hint">Acceso con usuario y contraseña.</p>
  </div>
  <form id="loginForm" autocomplete="off">
    <h2>Iniciar sesión</h2>
    <label>Usuario<input id="lu" required autofocus></label>
    <label>Contraseña<input id="lp" type="password" required></label>
    <div id="loginErr" class="err" hidden></div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <aside id="nav"></aside>
  <main>
    <header id="top">
      <button id="menuBtn" class="btn ghost" aria-label="Menú">☰</button>
      <label class="inline">Empresa <select id="empSel"></select></label>
      <span class="sp"></span>
      <span id="userBox"></span>
      <button class="btn ghost" id="pwBtn">Cambiar clave</button>
      <button class="btn" id="logoutBtn">Cerrar sesión</button>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
